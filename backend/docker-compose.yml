services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: ${CG_POSTGRES_PASSWORD:?Create backend/.env first}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    volumes:
      - crooked_galaxy_nakama_data:/var/lib/postgresql/data

  nakama:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        /nakama/nakama migrate up --database.address postgres:${CG_POSTGRES_PASSWORD}@postgres:5432/nakama?sslmode=disable &&
        exec /nakama/nakama --config /nakama/data/local.yml
        --database.address postgres:${CG_POSTGRES_PASSWORD}@postgres:5432/nakama?sslmode=disable
        --socket.server_key ${CG_NAKAMA_SERVER_KEY}
        --session.encryption_key ${CG_NAKAMA_SESSION_KEY}
        --session.refresh_encryption_key ${CG_NAKAMA_REFRESH_KEY}
        --runtime.http_key ${CG_NAKAMA_RUNTIME_HTTP_KEY}
        --console.password ${CG_NAKAMA_CONSOLE_PASSWORD}
        --console.signing_key ${CG_NAKAMA_CONSOLE_SIGNING_KEY}
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:7350:7350"
      - "127.0.0.1:7351:7351"
    restart: unless-stopped

volumes:
  crooked_galaxy_nakama_data:
