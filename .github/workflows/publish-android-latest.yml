name: Publish latest Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-latest
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.1
  GODOT_STATUS: stable
  APK_PATH: builds/android/CrookedGalaxy.apk

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}"
          curl -fL "$base/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip" -o godot.zip
          curl -fL "$base/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz" -o templates.tpz
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          unzip -q templates.tpz -d "$RUNNER_TEMP/godot-templates"
          template_root="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          mkdir -p "$(dirname "$template_root")"
          mv "$RUNNER_TEMP/godot-templates/templates" "$template_root"
          godot_bin="$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          chmod +x "$godot_bin"
          echo "GODOT_BIN=$godot_bin" >> "$GITHUB_ENV"

      - name: Restore stable Android test key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_DEBUG_KEYSTORE_BASE64"
          mkdir -p android
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > android/crooked-galaxy-debug.keystore

      - name: Export and verify APK
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s|^version/code=.*|version/code=${GITHUB_RUN_NUMBER}|" export_presets.cfg
          mkdir -p "$(dirname "$APK_PATH")"
          "$GODOT_BIN" --headless --path . --export-debug "Android APK" "$APK_PATH"
          test -s "$APK_PATH"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$apksigner_path" verify "$APK_PATH"

      - name: Publish stable latest link
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes="Automated Android test build from commit ${GITHUB_SHA}. Build ${GITHUB_RUN_NUMBER}."
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "Latest Android build" --notes "$notes"
          else
            gh release create latest --title "Latest Android build" --notes "$notes"
          fi
          gh release upload latest "$APK_PATH#CrookedGalaxy.apk" --clobber
          echo "APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/CrookedGalaxy.apk" >> "$GITHUB_STEP_SUMMARY"
